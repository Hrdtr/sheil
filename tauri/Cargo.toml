[package]
name = "app"
version = "0.1.1"
description = "Sheil — An open-source, cross-platform tool for managing remote and device connections"
authors = ["Sheil Contributors"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["test"] }
tauri-plugin-log = "2"
thiserror = "2"
aes-gcm = "0.11"
rand = "0.10"
russh = "0.61"
russh-sftp = "2"
serialport = "4"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
llama-cpp-2 = "0.1"
hf-hub = "1"
encoding_rs = "0.8"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "0.1", features = ["static-stdcxx"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
